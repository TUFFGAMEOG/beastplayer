kind = "web"
previewPath = "/"
title = "CineVault"
description = "A personal Netflix-style media library for browsing curated movies and shows, with search, watchlist, details, and a lawful embedded-player experience for user-provided video sources."
version = "1.0.0"
id = "artifacts/cinevault"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23889

[services.development]
run = "pnpm --filter @workspace/cinevault run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/cinevault", "run", "build" ]
serve = "static"
publicDir = "artifacts/cinevault/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23889"
BASE_PATH = "/"
